name: Unit Tests

# 非 tag 不编译、也不自动跑任何 workflow。
# 本文件只保留「手动运行」入口（且只跑零依赖单测，不调用 build.bat）；
# PR / 普通 push 一律零运行，质量门禁由本地 tests\gate.bat 保证。
# 唯一会自动运行的工作流是 release.yml（仅 push v* tag）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Unit tests (tests\run.bat)
        shell: cmd
        run: |
          rem Unit tests only: question-bank quality gate + mutation suite are
          rem already included in tests\run.bat. Building PCLock.exe is
          rem reserved for tag pushes; run tests\gate.bat locally for the
          rem full gate (tests + Release + Debug + manifest).
          call tests\run.bat
          if errorlevel 1 (
            echo [ERROR] unit tests failed
            exit /b 1
          )
          echo [OK] unit tests passed
