name: Build and Release PCLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List repository files
        shell: pwsh
        run: |
          Write-Host "===== 仓库根目录 ====="
          Get-ChildItem -Force | Select-Object Mode, Name
          Write-Host ""
          Write-Host "===== src 目录 ====="
          Get-ChildItem -Recurse src | Select-Object FullName

      - name: Build PCLock.exe
        shell: cmd
        run: |
          rem 复用仓库内的 build.bat 作为唯一编译入口，避免 CI 里的编译清单与脚本漂移。
          rem build.bat 内部已做 CI 感知（CI=true 时跳过 pause），产物在 bin\Release\。
          call build.bat Release
          if errorlevel 1 (
            echo [错误] build.bat 编译失败
            exit /b 1
          )

          if not exist bin\Release\PCLock.exe (
            echo [错误] bin\Release\PCLock.exe 未生成
            dir bin\Release
            exit /b 1
          )

          echo [成功] PCLock.exe 已生成
          dir bin\Release\PCLock.exe

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # 打包整个 bin\Release：build.bat 已把 PCLock.exe.config、chinese.txt、
          # english.txt、AppIcon.ico 一并复制到该目录，它们必须与 PCLock.exe 同目录。
          Copy-Item -Path "bin\Release\*" -Destination "release\" -Force -Recurse
          if (-not (Test-Path "release\PCLock.exe")) {
            Write-Error "release\PCLock.exe 缺失"
            exit 1
          }
          Compress-Archive -Path "release\*" -DestinationPath "PCLock-Release.zip" -Force
          Write-Host "===== 打包内容 ====="
          Get-ChildItem release

      - name: Upload ZIP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: PCLock-Release
          path: PCLock-Release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCLock-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
