name: Build and Release PCLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repository structure before build
        shell: pwsh
        run: |
          Write-Host "===== 仓库根目录 ====="
          Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Build with build.bat
        shell: cmd
        run: |
          cd pclock
          build.bat
          echo "===== build.bat 执行完毕 ====="
          dir /s /b

      - name: Show repository structure after build
        shell: pwsh
        run: |
          Write-Host "===== 构建后所有文件 ====="
          Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Find PCLock.exe
        shell: pwsh
        run: |
          Write-Host "===== 搜索所有 .exe 文件 ====="
          Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          # 先临时复制一个占位文件，避免这一步失败
          "placeholder" | Out-File -FilePath release\README.txt
          Compress-Archive -Path "release\*" -DestinationPath "PCLock-Release.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCLock-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
