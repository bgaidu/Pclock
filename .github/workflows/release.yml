name: Build and Release PCLock

# GitHub 编译只在打 tag 时触发；push 普通提交 / PR 不再编译。
# 去掉 workflow_dispatch：手动重跑发布构建请重新打 tag 或在 Actions 页面 rerun。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List repository files
        shell: pwsh
        run: |
          Write-Host "===== repo root ====="
          Get-ChildItem -Force | Select-Object Mode, Name
          Write-Host ""
          Write-Host "===== src ====="
          Get-ChildItem -Recurse src | Select-Object FullName

      - name: Build PCLock.exe
        shell: cmd
        run: |
          rem Reuse build.bat as the single build entry point.
          rem It skips pause when CI=true; output goes to bin\Release\.
          rem Keep this block pure ASCII: cmd.exe reads batch input with the
          rem system ANSI code page and CJK bytes may be mis-parsed.
          set CI=true
          call build.bat Release
          if errorlevel 1 (
            echo [ERROR] build.bat Release failed
            exit /b 1
          )
          if not exist bin\Release\PCLock.exe (
            echo [ERROR] bin\Release\PCLock.exe not generated
            dir bin\Release
            exit /b 1
          )
          echo [OK] PCLock.exe built
          dir bin\Release\PCLock.exe

      # build.bat does not delete stale outputs on failure: verify the timestamp
      # so a failed compile with an old exe left behind cannot be treated as OK.
      - name: Verify build artifact is fresh
        shell: powershell
        run: |
          $f = Get-Item 'bin\Release\PCLock.exe'
          $limit = (Get-Date).AddMinutes(-10)
          if ($f.LastWriteTime -lt $limit) {
            throw "Stale artifact (build may have failed, old exe left behind): $($f.LastWriteTime)"
          }
          Write-Host "$($f.Name)  $($f.Length) bytes  $($f.LastWriteTime)"

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # Package the whole bin\Release: build.bat already copied
          # PCLock.exe.config, chinese.txt, english.txt and AppIcon.ico there.
          Copy-Item -Path "bin\Release\*" -Destination "release\" -Force -Recurse
          if (-not (Test-Path "release\PCLock.exe")) {
            Write-Error "release\PCLock.exe missing"
            exit 1
          }
          Compress-Archive -Path "release\*" -DestinationPath "PCLock-Release.zip" -Force
          Write-Host "===== package contents ====="
          Get-ChildItem release

      - name: Upload ZIP to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: PCLock-Release
          path: PCLock-Release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCLock-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
