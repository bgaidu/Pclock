name: Build and Release PCLock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List repository files
        shell: pwsh
        run: |
          Write-Host "===== 仓库根目录 ====="
          Get-ChildItem -Force | Select-Object Mode, Name
          Write-Host ""
          Write-Host "===== src 目录 ====="
          Get-ChildItem -Recurse src | Select-Object FullName

      - name: Build PCLock.exe
        shell: cmd
        run: |
          rem 优先使用 .NET 3.5 编译器（Win7 自带，产物在 Win7 上无需额外运行库）
          set CSC=%WINDIR%\Microsoft.NET\Framework64\v3.5\csc.exe
          if not exist "%CSC%" set CSC=%WINDIR%\Microsoft.NET\Framework\v3.5\csc.exe
          if not exist "%CSC%" set CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe
          if not exist "%CSC%" set CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe
          if not exist "%CSC%" (
            echo [错误] 未找到 csc.exe
            exit /b 1
          )
          echo 使用编译器: %CSC%

          "%CSC%" /nologo /target:winexe /out:PCLock.exe /win32manifest:app.manifest /optimize+ /codepage:65001 ^
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll ^
            src\Program.cs src\App.cs src\Store.cs src\MathUtil.cs src\Protection.cs src\Watchdog.cs src\LockForm.cs src\SettingsForm.cs

          echo ExitCode: %errorlevel%

          if not exist PCLock.exe (
            echo [错误] PCLock.exe 未生成
            dir
            exit /b 1
          )

          echo [成功] PCLock.exe 已生成
          dir PCLock.exe

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path "PCLock.exe" -Destination "release\" -Force
          # 如需一起打包，可取消下面注释
          # Copy-Item -Path "app.manifest" -Destination "release\" -Force
          # Copy-Item -Path "README.md" -Destination "release\" -Force
          # Copy-Item -Path "LICENSE" -Destination "release\" -Force
          Compress-Archive -Path "release\*" -DestinationPath "PCLock-Release.zip" -Force
          Write-Host "===== 打包内容 ====="
          Get-ChildItem release

      - name: Upload ZIP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCLock-Release
          path: PCLock-Release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCLock-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
